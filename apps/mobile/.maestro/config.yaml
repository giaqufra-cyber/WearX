# Flussi Maestro (seduta 24, in CI dalla seduta 25): gli stessi percorsi dei test Playwright
# (e2e/), sul telefono. In CI girano su un emulatore Android (workflow "App su Android
# (Maestro)") contro l'ambiente E2E. In locale, con l'ambiente E2E acceso (e2e/README.md):
#   maestro test apps/mobile/.maestro
flows:
  - "*.yaml"
executionOrder:
  continueOnFailure: false
  flowsOrder:
    - registrazione
    - voto
    - pubblica
    - seguire
