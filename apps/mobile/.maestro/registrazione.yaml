appId: app.wearx.mobile
name: registrazione
env:
  EMAIL: nuova@e2e.test
  NICK: nuova.maestro
---
- launchApp:
    clearState: true
# Se il sistema mostra "... isn't responding", si aspetta invece di chiudere.
- tapOn:
    text: "Wait"
    optional: true
- tapOn: "Crea il tuo account"
- tapOn: "NICKNAME"
- inputText: ${NICK}
- tapOn: "EMAIL"
- inputText: ${EMAIL}
- tapOn: "PASSWORD"
- inputText: "Una-password-lunga-2026!"
- hideKeyboard
- scrollUntilVisible:
    element: "GIORNO"
    direction: DOWN
- tapOn: "GIORNO"
# Dopo 2 cifre il cursore passa da solo al mese e poi all'anno (la tastiera copre i campi).
- inputText: "14"
- inputText: "03"
- inputText: "2003"
- hideKeyboard
- scrollUntilVisible:
    element: "Continua"
    direction: DOWN
- tapOn: "Ho letto l'Informativa privacy.*"
- tapOn: "Accetto le regole della community.*"
- tapOn: "Continua"
- assertVisible: "Controlla la mail"
- tapOn: "CODICE"
- inputText: "123456"
- assertVisible: "Confermiamo.*"
- tapOn: "Stima con selfie.*"
# Pagina del fornitore di prova nel browser dell'app.
- tapOn: "Ho 18 anni o più"
- assertVisible: "Che profilo vuoi\\?"
- tapOn: "Continua"
- tapOn: "Old Money.*"
- tapOn: "Elegant.*"
- tapOn: "Entra in WearX"
# Il benvenuto è un avviso di pochi secondi: si controlla il feed.
- extendedWaitUntil:
    visible: "Feed dei tuoi stili"
    timeout: 15000
- assertVisible: "Old Money"
- takeScreenshot: android-registrazione
