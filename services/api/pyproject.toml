[project]
name = "wearx-api"
version = "0.1.0"
description = "API di WearX (FastAPI)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "redis>=5.0",
  "pyjwt[crypto]>=2.9",
  "httpx>=0.27",
  "python-multipart>=0.0.20",
  "boto3>=1.35",
  "arq>=0.26",
  "pillow>=11",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
  "moto[s3,server]>=5",
  "blurhash-python>=1.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101"]  # assert nei test

[tool.ruff.lint.per-file-ignores]
"migrations/**" = ["E501", "S608"]  # SQL costruito solo da costanti nel file
# Query composte da frammenti costanti del modulo (VISIBLE_STYLE_SQL, _CARD_COLUMNS);
# i valori dell'utente passano SEMPRE come parametri (:q, :slug, ...), mai nel testo.
"app/routers/styles.py" = ["S608"]
"app/profiles.py" = ["S608"]
"app/routers/posts.py" = ["S608"]
"app/routers/votes.py" = ["S608"]
"app/post_views.py" = ["S608"]
"app/feed.py" = ["S608"]
"app/routers/feed.py" = ["S608"]
"app/portfolio.py" = ["S608"]  # SQL composto solo da costanti del modulo
"app/routers/portfolio.py" = ["S608"]
"app/routers/social.py" = ["S608"]
"app/routers/reports.py" = ["S608"]
"app/routers/admin_console.py" = ["S608"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
# Librerie senza tipi: l'uso è racchiuso in app/storage.py e app/media/.
module = ["boto3.*", "botocore.*", "blurhash.*", "moto.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
