name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API (lint, tipi, test, migrazioni)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest -q
        env:
          WEARX_TEST_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
      - name: I tipi TypeScript corrispondono all'API
        run: |
          uv run -q python -m app.export_openapi > ../../packages/api-types/openapi.json
          git diff --exit-code -- ../../packages/api-types/openapi.json \
            || (echo "openapi.json non aggiornato: esegui 'pnpm --filter @wearx/api-types sync'" && exit 1)
        env:
          WEARX_ENV: test

  mobile:
    name: App (tipi, test token, bundle Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @wearx/design-tokens typecheck
      - run: pnpm --filter @wearx/design-tokens test
      - name: Tipi generati aggiornati
        run: |
          pnpm --filter @wearx/api-types generate
          git diff --exit-code -- packages/api-types/src/schema.ts
      - run: pnpm --filter @wearx/api-types typecheck
      - run: pnpm --filter @wearx/mobile typecheck
      - name: Bundle Android (verifica che il JavaScript compili)
        working-directory: apps/mobile
        run: npx expo export --platform android --output-dir /tmp/export
        env:
          EXPO_NO_TELEMETRY: "1"

  security:
    name: Sicurezza (segreti e dipendenze)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@v6
      - name: Vulnerabilità nelle dipendenze Python
        working-directory: services/api
        run: uv export --frozen --no-dev --format requirements-txt > /tmp/req.txt && uvx pip-audit -r /tmp/req.txt
