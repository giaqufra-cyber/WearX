name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API (lint, tipi, test, migrazioni)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest -q -rfE --junitxml=pytest-results.xml
        env:
          WEARX_TEST_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
      - name: Test falliti come annotazioni
        if: failure()
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          try:
              root = ET.parse("pytest-results.xml").getroot()
          except (OSError, ET.ParseError) as exc:
              print(f"::error title=pytest::nessun risultato ({exc})")
              raise SystemExit(0)
          shown = 0
          for case in root.iter("testcase"):
              for bad in list(case.findall("failure")) + list(case.findall("error")):
                  if shown >= 10:
                      raise SystemExit(0)
                  name = f"{case.get('classname')}::{case.get('name')}"
                  text = (bad.get("message") or "") + "\n" + (bad.text or "")
                  body = text.strip()[-1500:].replace("%", "%25").replace("\r", "").replace("\n", "%0A")
                  print(f"::error title={name}::{body}")
                  shown += 1
          PY
      - name: I tipi TypeScript corrispondono all'API
        run: |
          uv run -q python -m app.export_openapi > ../../packages/api-types/openapi.json
          git diff --exit-code -- ../../packages/api-types/openapi.json \
            || (echo "openapi.json non aggiornato: esegui 'pnpm --filter @wearx/api-types sync'" && exit 1)
        env:
          WEARX_ENV: test

  mobile:
    name: App (tipi, test, bundle Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @wearx/design-tokens typecheck
      - run: pnpm --filter @wearx/design-tokens test
      - name: Tipi generati aggiornati
        run: |
          pnpm --filter @wearx/api-types generate
          git diff --exit-code -- packages/api-types/src/schema.ts
      - run: pnpm --filter @wearx/api-types typecheck
      - run: pnpm --filter @wearx/mobile typecheck
      # I test falliti compaiono anche come annotazioni nella pagina della CI.
      - run: pnpm --filter @wearx/mobile test --ci --reporters=default --reporters=github-actions
      - name: Bundle Android (verifica che il JavaScript compili)
        working-directory: apps/mobile
        run: npx expo export --platform android --output-dir /tmp/export
        env:
          EXPO_NO_TELEMETRY: "1"

  admin:
    name: Pannello staff (tipi, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @wearx/admin typecheck
      - run: pnpm --filter @wearx/admin test
      - run: pnpm --filter @wearx/admin build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_API_URL: https://api.example.invalid
          NEXT_PUBLIC_SUPABASE_URL: https://example.invalid
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci

  containers:
    name: Container (immagini e prova di avvio)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      DB: postgresql+asyncpg://postgres:postgres@localhost:5432/wearx
    steps:
      - uses: actions/checkout@v4
      - name: Immagine API / worker / migrazioni
        run: docker build -t wearx-api:ci services/api
      - name: Immagine pannello staff
        run: >-
          docker build -f apps/admin/Dockerfile -t wearx-admin:ci
          --build-arg NEXT_PUBLIC_API_URL=https://api.example.test .
      - name: Migrazioni su un database vuoto
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -c "create role anon nologin" -c "create role authenticated nologin" \
            -c "create database wearx"
          docker run --rm --network host \
            -e WEARX_MIGRATION_DATABASE_URL=postgresql+psycopg://postgres:postgres@localhost:5432/wearx \
            wearx-api:ci alembic upgrade head
      - name: Avvio di API, worker e worker dei link come in staging
        run: |
          common="--network host -e WEARX_ENV=staging -e WEARX_DATABASE_URL=$DB -e WEARX_REDIS_URL=redis://localhost:6379/0 -e WEARX_PROXY_MODE=google"
          docker run -d --name api $common -e PORT=8080 wearx-api:ci
          docker run -d --name worker $common wearx-api:ci arq app.worker.WorkerSettings
          docker run -d --name links $common wearx-api:ci arq app.worker.LinkCheckSettings
          docker run -d --name admin -p 3000:8080 wearx-admin:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/readyz && break; sleep 2; done
          echo
          test "$(docker exec api id -u)" = "10001"
          ! curl -sI http://127.0.0.1:8080/healthz | grep -i '^server:'
          curl -sI http://127.0.0.1:8080/healthz | grep -i '^strict-transport-security:'
          # I worker scrivono il loro battito entro un minuto.
          for i in $(seq 1 45); do curl -sf http://127.0.0.1:8080/healthz/workers && break; sleep 3; done
          echo
          curl -sf http://127.0.0.1:8080/healthz/workers
          curl -sf -o /dev/null http://127.0.0.1:3000/
          curl -sI http://127.0.0.1:3000/ | grep -i '^content-security-policy:'
      - name: Log dei container
        if: always()
        run: for c in api worker links admin; do echo "== $c"; docker logs --tail 40 $c || true; done

  infra:
    name: Infrastruttura (Terraform e Checkov)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.5
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - uses: astral-sh/setup-uv@v6
      - name: Checkov (Terraform, Dockerfile, workflow)
        working-directory: .
        run: |
          uvx checkov==3.3.23 --quiet --compact --skip-download -d infra/terraform --framework terraform --var-file infra/terraform/envs/staging.tfvars
          uvx checkov==3.3.23 --quiet --compact --skip-download -d infra/terraform --framework terraform --var-file infra/terraform/envs/production.tfvars
          uvx checkov==3.3.23 --quiet --compact --skip-download -d . --framework dockerfile github_actions --skip-path node_modules

  e2e:
    name: Percorsi end-to-end (app web + API + worker)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: pnpm install --frozen-lockfile
      - name: App web per i test
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_URL: http://localhost:8000
          EXPO_PUBLIC_SUPABASE_URL: http://localhost:54321
          EXPO_PUBLIC_EMAIL_OTP: "1"
        run: npx expo export --platform web --output-dir dist-e2e
      - name: Browser
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Percorsi
        working-directory: e2e
        env:
          WEARX_TEST_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          (cd ../services/api && uv sync --frozen)
          ./run-local.sh
      - name: Registro dell'ambiente
        if: failure()
        run: |
          echo "::error title=Ambiente E2E::$(tail -n 30 /tmp/wearx-e2e.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-tracce
          path: e2e/test-results
          retention-days: 7

  security:
    name: Sicurezza (segreti, dipendenze, Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@v6
      - name: Vulnerabilità nelle dipendenze Python
        working-directory: services/api
        run: uv export --frozen --no-dev --format requirements-txt > /tmp/req.txt && uvx pip-audit -r /tmp/req.txt
      - name: Analisi statica (Semgrep, regole fissate + regole di progetto)
        run: uv tool install semgrep==1.179.0 && bash scripts/semgrep.sh

  zap:
    name: Scansione ZAP dell'API
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: API di scansione (database di prova, due persone, un fit)
        working-directory: services/api
        env:
          WEARX_TEST_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          uv sync --frozen
          nohup uv run python -m tests.scan_target 8000 > scan.log 2>&1 &
          for i in $(seq 1 60); do
            if [ -f scan-token.txt ] && curl -sf http://127.0.0.1:8000/healthz > /dev/null; then break; fi
            sleep 2
          done
          if ! curl -sf http://127.0.0.1:8000/healthz; then
            # Il registro completo della CI non sempre si legge: le ultime righe come annotazione.
            echo "::error title=API di scansione non partita::$(tail -n 25 scan.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi
      - name: ZAP (scansione attiva dall'OpenAPI, con accesso)
        run: |
          mkdir -p zap && chmod 777 zap
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" \
            -e ZAP_AUTH_HEADER_VALUE="Bearer $(cat services/api/scan-token.txt)" \
            -e ZAP_AUTH_HEADER_SITE="127.0.0.1" \
            ghcr.io/zaproxy/zaproxy:stable zap-api-scan.py \
            -t http://127.0.0.1:8000/openapi.json -f openapi -I -J zap.json -r zap.html \
            -z "-config scanner.maxScanDurationInMins=12 -config scanner.maxRuleDurationInMins=2"
      - name: Risultati come annotazioni
        if: always()
        run: python3 .zap/report.py zap/zap.json


  load:
    name: Test di carico (k6, un'istanza dell'API)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - uses: grafana/setup-k6-action@v1
      - name: API con 150 persone, fit e voti
        working-directory: services/api
        env:
          WEARX_TEST_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
          # Come in produzione (infra/terraform/main.tf).
          WEARX_DB_POOL_SIZE: "3"
          WEARX_DB_MAX_OVERFLOW: "2"
        run: |
          uv sync --frozen
          nohup uv run python -m tests.load_target 150 > load.log 2>&1 &
          for i in $(seq 1 150); do
            if grep -q "Carico pronto" load.log && curl -sf http://127.0.0.1:8000/healthz > /dev/null; then break; fi
            sleep 2
          done
          if ! curl -sf http://127.0.0.1:8000/healthz; then
            echo "::error title=API di carico non partita::$(tail -n 25 load.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi
      - name: k6 (100 persone in contemporanea, 90 secondi)
        run: |
          set -o pipefail
          k6 run -q -e USERS="$PWD/services/api/load-users.json" -e VUS=100 -e DURATION=90s \
            loadtest/api.js 2>&1 | tee k6.txt
      - name: Riepilogo
        if: always()
        run: |
          { echo '### Test di carico'; echo '```'; grep -E "p\(95\)|http_reqs|http_req_failed|checks_succeeded" k6.txt || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
